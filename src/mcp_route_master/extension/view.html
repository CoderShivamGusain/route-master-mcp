<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>route-master</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d2330; --muted: #677085; --line: #d9dee8; --card: #f6f8fb;
    --free: #1f8a4c; --free-bg: #eaf7ef; --sold: #b4bac6; --sold-bg: #eef0f4;
    --sel: #1f5fd1; --sel-bg: #e7efff; --lady: #c2387b; --lady-bg: #fdeef5;
    --pick: #e08a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f; --fg: #f2f2f2; --muted: #a3a3a3; --line: #2e2e2e; --card: #171717;
      --free: #22c55e; --free-bg: #2a2a2a; --sold: #8a8a8a; --sold-bg: #1f1f1f;
      --sel: #60a5fa; --sel-bg: #1e293b; --lady: #f472b6; --lady-bg: #2a1f26; --pick: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { padding: 12px; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 10px; }
  .decks { display: flex; flex-direction: column; gap: 14px; }
  .deck { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; max-width: 640px; }
  .deck h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .front { font-size: 11px; color: var(--muted); text-align: right; margin-bottom: 6px; }
  .grid { display: grid; gap: 7px; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; max-width: 360px; }
  /* Tiles like the site's own map: number on top, the price below in green; grey when sold. */
  .seat { min-width: 64px; min-height: 48px; border-radius: 8px; border: 1px solid var(--free);
    background: var(--free-bg); color: var(--fg); font: inherit; font-size: 13px; padding: 5px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.2; }
  .seat.sleeper { min-height: 100%; }
  .seat .tag { font-size: 10px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
  .seat.sold .tag { color: var(--sold); }
  .plan { font-size: 12px; color: var(--fg); margin: -2px 0 8px; max-width: 360px; }
  .aisle { border-left: 2px dashed var(--line); margin: 0 auto; width: 0; }
  .aisle-head { font-size: 10px; color: var(--muted); text-align: center; align-self: end; letter-spacing: .04em; }
  .side-head { font-size: 11px; color: var(--muted); text-align: center; align-self: end; }
  .aisle-label { font-size: 10px; color: var(--muted); writing-mode: vertical-rl; text-align: center; align-self: center; }
  .seat b { font-size: 13px; font-weight: 650; }
  .seat small { font-size: 12px; color: var(--free); }
  .seat.free { cursor: pointer; }
  .seat.free:hover, .seat.free:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
  .seat.sold { border-color: var(--sold); background: var(--sold-bg); color: var(--sold); cursor: default; }
  .seat.sold small { color: var(--sold); }
  .seat.selected { border-color: var(--sel); background: var(--sel-bg); }
  .seat.lady { border-color: var(--lady); background: var(--lady-bg); }
  .seat.pick { box-shadow: 0 0 0 3px var(--pick); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px;
    margin-right: 5px; vertical-align: -1px; border: 2px solid var(--c); background: var(--b); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr.pickable { cursor: pointer; }
  tr.pickable:hover td { background: var(--card); }
  .note { color: var(--muted); font-size: 12px; }
  .section + .section { margin-top: 16px; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  let nextId = 1;
  const post = msg => window.parent.postMessage(msg, "*");

  // ---- MCP Apps handshake (ChatGPT, Claude); window.openai is ChatGPT's older bridge.
  const initId = nextId++;
  post({ jsonrpc: "2.0", id: initId, method: "ui/initialize",
    params: { appInfo: { name: "route-master", version: "1" }, appCapabilities: {},
      protocolVersion: "2026-01-26" } });

  window.addEventListener("message", event => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id === initId && !msg.method) {
      post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
    } else if (msg.id !== undefined && msg.method) {
      post({ jsonrpc: "2.0", id: msg.id, result: {} });  // host requests (ping, teardown): just acknowledge
    } else if (msg.method === "ui/notifications/tool-result") {
      render(msg.params && msg.params.structuredContent);
    }
  });
  window.addEventListener("openai:set_globals", e => {
    const g = e.detail && e.detail.globals;
    if (g && g.toolOutput) render(g.toolOutput);
  });
  if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);

  // Ask for something in the chat, as the user ("I'd like seat L4").
  function say(text) {
    // Page text (operator names) goes into the user's message: plain, short.
    text = String(text).replace(/[\u0000-\u001f\u007f<>]/g, " ").slice(0, 160);
    if (window.openai && typeof window.openai.sendFollowUpMessage === "function") {
      window.openai.sendFollowUpMessage({ prompt: text });
      return;
    }
    post({ jsonrpc: "2.0", id: nextId++, method: "ui/message",
      params: { role: "user", content: [{ type: "text", text }] } });
  }

  function resize() {
    post({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
      params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight } });
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);

  // ---- rendering (data is untrusted: only textContent, never raw HTML)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  };

  function render(view) {
    if (!view || typeof view !== "object") return;
    app.replaceChildren();
    if (view.kind === "seats") renderSeats(view);
    else if (view.kind === "buses") renderBuses(view);
    resize();
  }

  function renderSeats(v) {
    app.append(el("h2", "", v.title || "Seats"));
    if (v.summary) app.append(el("p", "sub", v.summary));
    const decks = el("div", "decks");
    for (const d of Array.isArray(v.decks) ? v.decks : []) {
      const box = el("div", "deck");
      if (v.decks.length > 1) box.append(el("h3", "", String(d.deck || "").replace(/^./, c => c.toUpperCase()) + " deck"));
      if (d.plan) box.append(el("p", "plan", String(d.plan).replace(/^./, c => c.toUpperCase())));
      box.append(el("div", "front", "Front (driver) ▲"));
      const positioned = Number.isInteger(d.rows) && Number.isInteger(d.cols) && d.rows > 0 && d.cols > 0 && d.cols <= 12;
      const grid = el("div", positioned ? "grid" : "flow");
      // An extra narrow column for the aisle, so it's clear which side has single and which double seats.
      const gap = positioned && Number.isInteger(d.aisle_after) ? d.aisle_after : null;
      const col = c => c + 1 + (gap !== null && c > gap ? 1 : 0);
      if (positioned) {
        const tracks = [];
        const emptyAisle = Number.isInteger(d.aisle_col) ? d.aisle_col : null;
        for (let c = 0; c < d.cols; c++) {
          tracks.push(c === emptyAisle ? "minmax(40px, auto)" : "minmax(64px, 1fr)"); // (a back-row middle seat may sit there)
          if (c === gap) tracks.push("40px");
        }
        grid.style.gridTemplateColumns = tracks.join(" ");
        if (gap !== null || emptyAisle !== null) {
          const a = el("div", "aisle");
          a.style.gridColumn = String(gap !== null ? gap + 2 : emptyAisle + 1);
          a.style.gridRow = `1 / ${d.rows + 1}`;
          grid.append(a);
        }
      }
      for (const s of Array.isArray(d.seats) ? d.seats : []) {
        const free = s.s === "available";
        const cls = ["seat", s.s === "sold" ? "sold" : s.s === "selected" ? "selected" : "free"];
        if (s.k === "sleeper") cls.push("sleeper");
        if (s.f && s.s !== "sold") cls.push("lady");
        if (s.pick && free) cls.push("pick");
        const b = el("button", cls.join(" "));
        b.type = "button";
        b.append(el("b", "", String(s.n) + (s.f ? " " + s.f : "")));
        if (d.mixed) b.append(el("span", "tag", s.k === "sleeper" ? "Berth" : s.k === "semi_sleeper" ? "Semi" : "Seat"));
        b.append(el("small", "", s.s === "sold" ? "sold" : s.s === "selected" ? "selected"
          : (typeof s.p === "number" ? "₹" + s.p.toLocaleString("en-IN") : "")));
        const what = [d.deck + " deck", s.type || (s.k === "sleeper" ? "sleeper berth" : "seat"),
          s.single ? "single (window)" : s.w ? "window" : "", s.side ? s.side + " side" : ""].filter(Boolean).join(", ");
        b.title = `${s.n} · ${what}` + (s.f === "F" ? " · women only" : s.f === "M" ? " · men only" : "");
        if (positioned && Number.isInteger(s.r) && Number.isInteger(s.c)) {
          b.style.gridRow = s.span === 2 ? `${s.r + 1} / span 2` : String(s.r + 1);
          b.style.gridColumn = String(col(s.c));
        }
        const kindWord = s.k === "sleeper" ? "berth" : "seat";
        if (free) b.addEventListener("click", () => say(`I'd like ${kindWord} ${s.n} (${d.deck} deck).`));
        else b.disabled = true;
        grid.append(b);
      }
      box.append(grid);
      decks.append(box);
    }
    app.append(decks);
    const legend = el("div", "legend");
    const item = (text, c, b) => { const s = el("span", "", text); s.style.setProperty("--c", c); s.style.setProperty("--b", b); legend.append(s); };
    item("Free", "var(--free)", "var(--free-bg)");
    item("Sold", "var(--sold)", "var(--sold-bg)");
    item("Selected", "var(--sel)", "var(--sel-bg)");
    item("Women/men only", "var(--lady)", "var(--lady-bg)");
    item("Suggested", "var(--pick)", "transparent");
    const kinds = el("p", "hint", "Berth = sleeper bed you lie on (long tile) · Seat = chair (short tile) · dashed line = aisle.");
    app.append(legend);
    if ((v.decks || []).some(d => d.mixed)) app.append(kinds);
    app.append(el("p", "hint", "Tap a free seat to choose it." +
      (v.positions ? " Labels are positions; the site shows its own seat number once one is picked." : "")));
  }

  function renderBuses(v) {
    for (const sec of Array.isArray(v.sections) ? v.sections : []) {
      const box = el("div", "section");
      const day = String(sec.title || "").split(" · ")[1] || "";
      box.append(el("h2", "", sec.title || "Buses"));
      for (const n of Array.isArray(sec.notes) ? sec.notes : []) box.append(el("p", "note", n));
      const wrap = el("div", "wrap");
      const t = el("table");
      const head = el("tr");
      const rows = Array.isArray(sec.rows) ? sec.rows : [];
      const withSite = rows.some(r => r.site);
      for (const h of ["#", "Time", "Bus", "Fare", "Trust", "Note", ...(withSite ? ["Site"] : [])]) head.append(el("th", "", h));
      t.append(head);
      for (const r of Array.isArray(sec.rows) ? sec.rows : []) {
        const tr = el("tr", "pickable");
        for (const c of [r.n, r.time, r.bus, r.fare, r.trust, r.note, ...(withSite ? [r.site || ""] : [])]) tr.append(el("td", "", c));
        tr.title = "Show this bus's seats";
        tr.addEventListener("click", () => {
          const op = String(r.bus || "").split(" · ")[0];
          const dep = String(r.time || "").split(" ")[0];
          const arr = (String(r.time || "").split("→")[1] || "").trim().split(" ")[0];
          say(`Show me the seats on ${op} at ${dep}` + (arr ? ` (arriving ${arr})` : "") + (day ? ` on ${day}` : "") + (r.site ? ` (${r.site})` : "") + ".");
        });
        t.append(tr);
      }
      wrap.append(t);
      box.append(wrap);
      app.append(box);
    }
    app.append(el("p", "hint", "Tap a bus to see its seat map."));
  }
})();
</script>
</body>
</html>
