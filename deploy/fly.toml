# Fly.io, from the repo root: `fly launch --config deploy/fly.toml --no-deploy`, then
# `fly deploy --config deploy/fly.toml --dockerfile Dockerfile`.
app = "mcp-route-master"   # change to a unique name
primary_region = "bom"     # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_ALLOWED_HOSTS = "mcp-route-master.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "3s"
